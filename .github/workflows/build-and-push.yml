name: "Build and push container image"

# Tagging strategy: keep it simple -- every successful build on main is
# pushed as ":latest", the one tag EventBridge + the CodePipeline ECR
# source action watch as "the newest version to deploy".
#   - the ECR repo itself is ImageTagMutability: MUTABLE (see
#     photo-uploader-infra/bootstrap/00-bootstrap.yaml), which is
#     what makes re-pushing ":latest" on every build valid rather than
#     rejected.
on:
  push:
    branches: [main]

permissions:
  id-token: write   # required for OIDC -> AWS
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # TEMPORARY DIAGNOSTIC: hardcoded in place of
          # ${{ secrets.AWS_ECR_PUSH_ROLE_ARN }} to rule out a bad/stale
          # secret value vs. a trust-policy/AWS-side problem. Revert once
          # the test run's result is known.
          role-to-assume: arn:aws:iam::047719661196:role/photo-uploader-gha-ecr-push-role
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tag
        id: tags
        run: |
          REPO_URI="${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}"
          echo "latest_tag=$REPO_URI:latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.latest_tag }}

      # CodePipeline's second source action (in photo-uploader-infra) reads
      # these two files from S3 instead of connecting to GitHub directly --
      # no CodeStarSourceConnection/GitHub App to authorize by hand.
      - name: Upload deploy templates for CodePipeline
        run: |
          cd ecs
          zip deploy-templates.zip appspec.yaml taskdef.json
          aws s3 cp deploy-templates.zip \
            "s3://${{ vars.PIPELINE_ARTIFACT_BUCKET }}/deploy-templates/deploy-templates.zip"

      - name: Summary
        run: |
          echo "### Image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.tags.outputs.latest_tag }}\` (deploy trigger)" >> "$GITHUB_STEP_SUMMARY"
          echo "- deploy templates uploaded to \`s3://${{ vars.PIPELINE_ARTIFACT_BUCKET }}/deploy-templates/deploy-templates.zip\`" >> "$GITHUB_STEP_SUMMARY"
