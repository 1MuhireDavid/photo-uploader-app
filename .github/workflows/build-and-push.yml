name: "Build and push container image"

# Tagging strategy: keep it simple -- every successful build on main is
# pushed as ":latest", the one tag EventBridge + the CodePipeline ECR
# source action watch as "the newest version to deploy".
#   - the ECR repo itself is ImageTagMutability: MUTABLE (see
#     photo-uploader-infra/bootstrap/00-bootstrap.yaml), which is
#     what makes re-pushing ":latest" on every build valid rather than
#     rejected.
on:
  push:
    branches: [main]

permissions:
  id-token: write   # required for OIDC -> AWS
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tag
        id: tags
        run: |
          REPO_URI="${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}"
          echo "latest_tag=$REPO_URI:latest" >> "$GITHUB_OUTPUT"

      # CodePipeline's second source action (in photo-uploader-infra) reads
      # these two files from S3 instead of connecting to GitHub directly --
      # no CodeStarSourceConnection/GitHub App to authorize by hand.
      #
      # Deliberately runs BEFORE "Build and push image" below: pushing the
      # image is what fires the ECR PUSH EventBridge rule that starts
      # CodePipeline, which then immediately reads whatever is CURRENTLY at
      # this S3 key (PollForSourceChanges: false, see 07-cicd-pipeline.yaml)
      # -- if the image push happened first, the pipeline could start and
      # read the S3 object before this step got a chance to update it,
      # deploying a stale/mismatched deploy-templates.zip.
      #
      # Zipped from the repo root (not `cd ecs` first) so the zip's internal
      # paths are "ecs/appspec.yaml" / "ecs/taskdef.json" -- that prefix is
      # what 07-cicd-pipeline.yaml's TaskDefinitionTemplatePath/
      # AppSpecTemplatePath (DeployTemplatesPath, default "ecs") expect. A
      # flattened zip (paths without "ecs/") fails the Deploy stage with
      # "Exception while trying to read the task definition artifact file".
      #
      # continue-on-error: true -- on the very first run (before the infra
      # root stack exists), PIPELINE_ARTIFACT_BUCKET isn't set yet and this
      # step is expected to fail; the image still needs to push regardless
      # (see the infra repo's README, "Full setup order"). Once the bucket
      # exists, this step succeeds and its ordering above is what matters.
      - name: Upload deploy templates for CodePipeline
        id: upload-templates
        continue-on-error: true
        run: |
          zip deploy-templates.zip ecs/appspec.yaml ecs/taskdef.json
          aws s3 cp deploy-templates.zip \
            "s3://${{ vars.PIPELINE_ARTIFACT_BUCKET }}/deploy-templates/deploy-templates.zip"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.latest_tag }}

      - name: Summary
        run: |
          echo "### Image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.tags.outputs.latest_tag }}\` (deploy trigger)" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.upload-templates.outcome }}" = "success" ]; then
            echo "- deploy templates uploaded to \`s3://${{ vars.PIPELINE_ARTIFACT_BUCKET }}/deploy-templates/deploy-templates.zip\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- deploy templates upload **failed** (expected on the very first run, before PIPELINE_ARTIFACT_BUCKET exists -- re-run this workflow once the infra root stack has deployed)" >> "$GITHUB_STEP_SUMMARY"
          fi
