name: Build and push container image

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  INFRA_STACK_NAME: ${{ vars.INFRA_STACK_NAME }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  TEMPLATES_DIR: ecs
  RENDER_DIR: build
  ARTIFACT_KEY: deploy-templates/deploy-templates.zip

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test
        run: mvn -B --no-transfer-progress test

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Skipped on the very first run: the image has to reach ECR before the
      # infra stack can create the ECS service that pulls it.
      - name: Render and upload deployment templates
        run: |
          set -euo pipefail

          if ! outputs="$(aws cloudformation describe-stacks --stack-name "$INFRA_STACK_NAME" \
                            --query 'Stacks[0].Outputs' --output json 2>error.log)"; then
            grep -q 'does not exist' error.log || { cat error.log; exit 1; }
            echo "::notice::Stack '$INFRA_STACK_NAME' does not exist yet; pushing the image only"
            exit 0
          fi

          declare -A cfg
          for key in ArtifactBucketName TaskExecutionRoleArn TaskRoleArn LogGroupName \
                     PhotosBucketName CloudFrontDomainName DbEndpointAddress DbPort \
                     DbName DbSecretArn; do
            cfg[$key]="$(jq -r --arg k "$key" 'map(select(.OutputKey == $k))[0].OutputValue // empty' <<<"$outputs")"
            [ -n "${cfg[$key]}" ] || { echo "::error::Stack output missing: $key"; exit 1; }
          done

          rendered="$RENDER_DIR/$TEMPLATES_DIR"
          mkdir -p "$rendered"
          sed -e "s|<TASK_EXECUTION_ROLE_ARN>|${cfg[TaskExecutionRoleArn]}|g" \
              -e "s|<TASK_ROLE_ARN>|${cfg[TaskRoleArn]}|g" \
              -e "s|<LOG_GROUP>|${cfg[LogGroupName]}|g" \
              -e "s|<AWS_REGION>|$AWS_REGION|g" \
              -e "s|<PHOTOS_BUCKET_NAME>|${cfg[PhotosBucketName]}|g" \
              -e "s|<CLOUDFRONT_DOMAIN>|${cfg[CloudFrontDomainName]}|g" \
              -e "s|<DB_HOST>|${cfg[DbEndpointAddress]}|g" \
              -e "s|<DB_PORT>|${cfg[DbPort]}|g" \
              -e "s|<DB_NAME>|${cfg[DbName]}|g" \
              -e "s|<DB_SECRET_ARN>|${cfg[DbSecretArn]}|g" \
              "$TEMPLATES_DIR/taskdef.json" > "$rendered/taskdef.json"

          leftover="$(grep -oE '<[A-Z0-9_]+>' "$rendered/taskdef.json" | grep -vx '<IMAGE1_NAME>' | sort -u || true)"
          [ -z "$leftover" ] || { echo "::error::Unsubstituted placeholders: $leftover"; exit 1; }
          jq empty "$rendered/taskdef.json"

          cp "$TEMPLATES_DIR/appspec.yaml" "$rendered/appspec.yaml"
          (cd "$RENDER_DIR" && zip -qr deploy-templates.zip "$TEMPLATES_DIR")
          aws s3 cp "$RENDER_DIR/deploy-templates.zip" \
            "s3://${cfg[ArtifactBucketName]}/$ARTIFACT_KEY" --only-show-errors

      - uses: docker/setup-buildx-action@v3

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:latest
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
